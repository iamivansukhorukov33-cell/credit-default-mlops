# DVC pipeline — воспроизводимая цепочка этапов.
stages:
  prepare:
    cmd: python -m src.data prepare
    deps:
      - data/raw/credit.csv
      - src/data.py
      - src/schema.py
      - src/validation.py
      - requirements.txt
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  eda:
    cmd: python -m src.eda
    deps:
      - data/processed/train.csv
      - src/eda.py
      - src/schema.py
    outs:
      - reports/eda
  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
      - src/model.py
      - src/features.py
      - src/schema.py
      - src/validation.py
      - requirements.txt
    outs:
      - models/pipeline.joblib
      - reports/roc.png
      - reports/experiments.json
    metrics:
      - reports/metrics.json:
          cache: false
